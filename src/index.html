<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Explore the Azure OSDU stack, the SPI boundary, and the engineering system behind it."
    />
    <title>Inside the Azure stack · OSDU Fieldnotes</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e263e'/%3E%3Cpath d='m7 11 9-5 9 5-9 5z' fill='%2359cced'/%3E%3Cpath d='m7 17 9 5 9-5M7 23l9 5 9-5' stroke='%2359cced' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/architecture.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a
        href="#running-stack"
        class="brand"
        aria-label="OSDU Fieldnotes, first chapter"
        ><span class="brand-mark" aria-hidden="true">≋</span
        ><span>OSDU <strong>FIELDNOTES</strong></span></a
      >
      <div class="header-meta">
        <span>AZURE ENGINEERING</span
        ><span class="edition">Concept prototype</span>
      </div>
    </header>
    <div class="shell">
      <aside class="rail" aria-label="Guide navigation">
        <div class="rail-label">Inside the Azure stack</div>
        <nav aria-label="Chapters" id="chapter-navigation"></nav>
        <p class="rail-note">
          Explore a component.<br />Follow a lifecycle.<br />Keep a useful link.
        </p>
      </aside>
      <main id="main-content">
        <p class="chapter-kicker" id="chapter-kicker"></p>
        <p class="premise" id="premise"></p>
        <div class="intro">
          <h1 id="headline"></h1>
          <p id="introduction"></p>
        </div>
        <section class="exploration" aria-label="Interactive architecture">
          <header class="visual-header">
            <h2 id="figure-title"></h2>
            <span>Select a component to look closer ↗</span>
          </header>
          <div class="visual-workspace">
            <div id="diagram" class="diagram"></div>
            <aside
              id="inspector"
              class="inspector"
              aria-label="Selected component explanation"
            >
              <div class="inspector-heading">
                <span id="detail-label" class="detail-label"></span>
                <h3 id="detail-title"></h3>
                <button
                  type="button"
                  id="detail-toggle"
                  aria-expanded="false"
                  aria-controls="detail-body"
                >
                  Read explanation ↑
                </button>
              </div>
              <div
                id="detail-body"
                class="detail-body"
                aria-live="polite"
                aria-atomic="true"
              >
                <p id="detail-copy"></p>
                <div class="detail-artifact" id="detail-artifact">
                  <span id="artifact-label"></span>
                  <pre><code id="artifact-code"></code></pre>
                </div>
                <a
                  id="detail-source"
                  target="_blank"
                  rel="noopener noreferrer"
                ></a>
              </div>
            </aside>
          </div>
        </section>
        <div id="chapter-reference"></div>
        <div class="below-figure">
          <p id="scope-note"></p>
          <details id="source-details">
            <summary>
              Go deeper in the documentation <span aria-hidden="true">+</span>
            </summary>
            <div id="sources"></div>
          </details>
        </div>
        <footer class="chapter-footer">
          <span id="chapter-position"></span><a id="next-link"></a>
        </footer>
      </main>
    </div>
  </body>
</html>
