<!DOCTYPE html>
<!--
  Splash image for the hackathon idea gallery, in the tone of the site's machinery artwork:
  flat vector, thin navy linework, muted fills in blue, green, and burnt orange, white background, no words.
  An engineer directs an assembly line of three agent arms that build the site sheet by sheet;
  a field notebook captures the record and feeds back to the engineer.
  Re-render: SCALE=2 bash ~/.claude/skills/infographic/scripts/render.sh hackathon-splash.html hackathon-splash.png 1600x900
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azure SPI Fieldnotes splash</title>
<style>
  html,body{margin:0;background:#fff}
  .sheet{width:1600px;height:900px;background:#fff}
  .n{stroke:#102c47;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .nf{stroke:#102c47;stroke-width:5;stroke-linejoin:round}
  .thin{stroke:#102c47;stroke-width:3.5;stroke-linecap:round;fill:none}
  .blue{fill:#0b6a9c} .green{fill:#1f7a5c} .orange{fill:#a34d21}
  .blue-t{fill:#cfe3f0} .green-t{fill:#cfe8dc} .orange-t{fill:#f6dcc9} .gray-t{fill:#e6ecf1} .white{fill:#fff}
</style>
</head>
<body>
<div class="sheet">
<svg width="1600" height="900" viewBox="60 40 1480 860">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#102c47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <!-- ground line -->
  <path d="M120,790 H1480" class="thin" stroke-dasharray="2 14"/>

  <!-- feedback arc: from the notebook back to the engineer -->
  <path d="M1350,420 C1250,40 520,10 268,410" class="thin" stroke-dasharray="10 12" marker-end="url(#ah)"/>

  <!-- gantry -->
  <rect x="470" y="236" width="740" height="34" rx="8" class="nf gray-t"/>
  <path d="M500,270 V560 M1180,270 V560" class="n"/>
  <rect x="482" y="546" width="36" height="22" rx="4" class="nf gray-t"/>
  <rect x="1162" y="546" width="36" height="22" rx="4" class="nf gray-t"/>

  <!-- sheet 1: blank wireframe -->
  <g transform="translate(560,470)">
    <rect x="0" y="0" width="120" height="90" rx="6" class="nf white"/>
    <rect x="12" y="12" width="96" height="14" rx="3" class="thin" stroke-dasharray="6 5"/>
    <rect x="12" y="34" width="44" height="42" rx="3" class="thin" stroke-dasharray="6 5"/>
    <rect x="64" y="34" width="44" height="42" rx="3" class="thin" stroke-dasharray="6 5"/>
  </g>

  <!-- sheet 2: partly built -->
  <g transform="translate(780,470)">
    <rect x="0" y="0" width="120" height="90" rx="6" class="nf white"/>
    <rect x="12" y="12" width="96" height="14" rx="3" class="nf blue-t"/>
    <rect x="12" y="34" width="44" height="42" rx="3" class="nf green-t"/>
    <rect x="64" y="34" width="44" height="42" rx="3" class="thin" stroke-dasharray="6 5"/>
  </g>

  <!-- sheet 3: the finished site, a browser window with the map -->
  <g transform="translate(1000,440)">
    <rect x="0" y="0" width="150" height="120" rx="8" class="nf white"/>
    <path d="M0,24 H150" class="n"/>
    <circle cx="16" cy="12" r="4" class="blue"/><circle cx="30" cy="12" r="4" class="green"/><circle cx="44" cy="12" r="4" class="orange"/>
    <rect x="14" y="36" width="122" height="20" rx="4" class="nf blue-t"/>
    <rect x="14" y="62" width="122" height="20" rx="4" class="nf green-t"/>
    <rect x="14" y="88" width="122" height="20" rx="4" class="nf orange-t"/>
    <circle cx="36" cy="46" r="5" class="blue"/><circle cx="70" cy="72" r="5" class="green"/><circle cx="110" cy="98" r="5" class="orange"/>
  </g>

  <!-- arm 1, blue, pencil: writes -->
  <g>
    <rect x="588" y="270" width="44" height="70" rx="6" class="nf blue-t"/>
    <circle cx="610" cy="352" r="16" class="nf white"/>
    <path d="M610,352 L650,420" class="n"/>
    <circle cx="650" cy="420" r="12" class="nf white"/>
    <!-- pencil -->
    <g transform="translate(650,420) rotate(35)">
      <rect x="-9" y="0" width="18" height="62" class="nf blue-t"/>
      <path d="M-9,62 L0,84 L9,62 Z" class="nf" fill="#fff"/>
      <path d="M-3,76 L0,84 L3,76 Z" class="blue"/>
      <rect x="-9" y="-14" width="18" height="14" rx="3" class="nf blue"/>
    </g>
  </g>

  <!-- arm 2, green, plug: connects -->
  <g>
    <rect x="818" y="270" width="44" height="70" rx="6" class="nf green-t"/>
    <circle cx="840" cy="352" r="16" class="nf white"/>
    <path d="M840,352 L840,420" class="n"/>
    <circle cx="840" cy="420" r="12" class="nf white"/>
    <!-- plug -->
    <g transform="translate(840,432)">
      <path d="M0,0 V18" class="n"/>
      <rect x="-26" y="18" width="52" height="40" rx="10" class="nf green-t"/>
      <path d="M-12,58 V82 M12,58 V82" class="n" stroke-width="7"/>
      <circle cx="0" cy="38" r="6" class="green"/>
    </g>
  </g>

  <!-- arm 3, orange, magnifier: reviews -->
  <g>
    <rect x="1048" y="270" width="44" height="70" rx="6" class="nf orange-t"/>
    <circle cx="1070" cy="352" r="16" class="nf white"/>
    <path d="M1070,352 L1040,392" class="n"/>
    <circle cx="1040" cy="392" r="12" class="nf white"/>
    <g transform="translate(1040,392) rotate(-35)">
      <path d="M0,10 V44" class="n" stroke-width="9"/>
      <circle cx="0" cy="80" r="36" fill="#a34d21" fill-opacity="0.18" stroke="#102c47" stroke-width="5"/>
      <circle cx="0" cy="80" r="26" fill="none" stroke="#a34d21" stroke-width="3"/>
      <path d="M-14,70 Q-8,58 4,60" class="thin" stroke="#a34d21"/>
    </g>
  </g>

  <!-- conveyor belt -->
  <path d="M420,560 H1260 a40,40 0 0 1 0,80 H420 a40,40 0 0 1 0,-80 Z" class="nf gray-t"/>
  <circle cx="420" cy="600" r="22" class="nf white"/><circle cx="420" cy="600" r="6" class="blue"/>
  <circle cx="1260" cy="600" r="22" class="nf white"/><circle cx="1260" cy="600" r="6" class="blue"/>
  <path d="M480,600 H1200" class="thin" stroke-dasharray="26 18"/>
  <path d="M520,640 V790 M1160,640 V790" class="n"/>
  <path d="M470,790 H570 M1110,790 H1210" class="n"/>

  <!-- the engineer at a control stand -->
  <g transform="translate(150,380)">
    <!-- head -->
    <circle cx="80" cy="96" r="32" class="nf white"/>
    <!-- hard hat -->
    <path d="M38,66 a42,42 0 0 1 84,0 Z" class="nf orange-t"/>
    <rect x="26" y="62" width="108" height="14" rx="6" class="nf orange"/>
    <!-- torso -->
    <path d="M30,178 a50,50 0 0 1 100,0 V300 H30 Z" class="nf blue-t"/>
    <path d="M62,132 L80,150 L98,132" class="thin"/>
    <!-- arm pointing at the line -->
    <path d="M128,168 L214,206" class="n" stroke-width="13"/>
    <circle cx="220" cy="208" r="11" class="nf white"/>
    <!-- arm with the clipboard -->
    <path d="M34,170 L14,248" class="n" stroke-width="13"/>
    <rect x="-40" y="250" width="66" height="88" rx="6" class="nf white"/>
    <rect x="-22" y="242" width="30" height="16" rx="4" class="nf orange-t"/>
    <path d="M-26,282 H12 M-26,300 H12 M-26,318 H-4" class="thin"/>
    <circle cx="14" cy="254" r="11" class="nf white"/>
    <!-- legs -->
    <rect x="38" y="300" width="34" height="110" rx="6" class="nf gray-t"/>
    <rect x="88" y="300" width="34" height="110" rx="6" class="nf gray-t"/>
    <rect x="30" y="396" width="46" height="14" rx="6" class="nf blue"/>
    <rect x="84" y="396" width="46" height="14" rx="6" class="nf blue"/>
  </g>
  <!-- control stand -->
  <g transform="translate(300,470)">
    <path d="M0,60 H120 L110,0 H10 Z" class="nf gray-t"/>
    <rect x="30" y="60" width="60" height="260" rx="6" class="nf gray-t"/>
    <path d="M60,0 L84,-70" class="n" stroke-width="7"/>
    <circle cx="86" cy="-76" r="12" class="nf orange"/>
    <circle cx="36" cy="30" r="8" class="blue"/><circle cx="60" cy="30" r="8" class="green"/><circle cx="84" cy="30" r="8" class="orange"/>
  </g>

  <!-- the field notebook capturing the record -->
  <g transform="translate(1330,450)">
    <!-- notebook body, slightly tilted -->
    <g transform="rotate(-6)">
      <rect x="0" y="0" width="190" height="250" rx="10" class="nf white"/>
      <rect x="0" y="0" width="190" height="250" rx="10" class="nf blue-t"/>
      <rect x="22" y="0" width="168" height="250" rx="8" class="nf white"/>
      <!-- spiral -->
      <g class="n" stroke-width="4"><path d="M8,30 h20 M8,70 h20 M8,110 h20 M8,150 h20 M8,190 h20 M8,230 h20"/></g>
      <!-- bar chart of the record -->
      <rect x="50" y="150" width="20" height="60" class="nf blue-t"/>
      <rect x="80" y="110" width="20" height="100" class="nf green-t"/>
      <rect x="110" y="170" width="20" height="40" class="nf orange-t"/>
      <path d="M44,210 H150" class="thin"/>
      <!-- rule lines -->
      <path d="M48,40 H160 M48,64 H140 M48,88 H150" class="thin" stroke="#52697b"/>
      <!-- bookmark -->
      <path d="M150,0 V56 L136,44 L122,56 V0" class="nf orange"/>
    </g>
    <!-- pen resting on it -->
    <g transform="translate(120,236) rotate(-58)">
      <rect x="-8" y="0" width="16" height="84" rx="4" class="nf green-t"/>
      <path d="M-8,84 L0,104 L8,84 Z" class="nf white"/>
      <rect x="-8" y="-10" width="16" height="10" rx="3" class="nf green"/>
    </g>
  </g>

  <!-- output chute from belt to notebook -->
  <path d="M1262,560 C1300,560 1310,470 1340,462" class="thin" stroke-dasharray="10 12" marker-end="url(#ah)"/>
</svg>
</div>
</body>
</html>
