<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0;background:#fff}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#102b43;-webkit-font-smoothing:antialiased}
.sheet{width:1400px;height:590px;background:#fff;padding:36px 44px;display:flex;flex-direction:column;gap:6px}
.t{font-family:Manrope,'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;font-weight:800;letter-spacing:-.4px;color:#102c47;margin:0}
.s{font-size:24px;color:#52697b;margin:0 0 8px}
svg text{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.lab{font-size:27px;font-weight:500;fill:#102b43} .sub{font-size:22px;fill:#52697b}
.val{font-size:26px;font-weight:700;fill:#102b43} .valw{font-size:26px;font-weight:700;fill:#fff}
.tick{font-size:21px;fill:#52697b} .ptitle{font-family:Manrope,'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;fill:#102c47}
.note{font-size:22px;fill:#52697b} .leg{font-size:24px;fill:#102b43}
</style></head><body>
<div class="sheet">
<p class="t">Where the tokens went, by day</p>
<p class="s">New input plus output, millions of tokens. Cache reads are left out; on this scale they would be thirty times taller.</p>
<svg width="1312" height="450" viewBox="0 0 1312 450">
<line x1="80" x2="1000" y1="340.0" y2="340.0" stroke="#52697b" stroke-width="2"/>
<text x="66" y="347.0" class="tick" text-anchor="end">0 M</text>
<line x1="80" x2="1000" y1="280.0" y2="280.0" stroke="#cedbe5" stroke-width="1"/>
<text x="66" y="287.0" class="tick" text-anchor="end">5 M</text>
<line x1="80" x2="1000" y1="220.0" y2="220.0" stroke="#cedbe5" stroke-width="1"/>
<text x="66" y="227.0" class="tick" text-anchor="end">10 M</text>
<line x1="80" x2="1000" y1="160.0" y2="160.0" stroke="#cedbe5" stroke-width="1"/>
<text x="66" y="167.0" class="tick" text-anchor="end">15 M</text>
<line x1="80" x2="1000" y1="100.0" y2="100.0" stroke="#cedbe5" stroke-width="1"/>
<text x="66" y="107.0" class="tick" text-anchor="end">20 M</text>
<line x1="80" x2="1000" y1="40.0" y2="40.0" stroke="#cedbe5" stroke-width="1"/>
<text x="66" y="47.0" class="tick" text-anchor="end">25 M</text>
<rect x="140" y="317.2" width="120" height="22.8" fill="#0b6a9c"/>
<rect x="140" y="301.6" width="120" height="15.6" fill="#a34d21"/>
<text x="200" y="289.6" class="val" text-anchor="middle">3.2 M</text>
<text x="200" y="376" class="lab" text-anchor="middle">Day 1</text>
<text x="200" y="406" class="sub" text-anchor="middle">prototype,</text>
<text x="200" y="432" class="sub" text-anchor="middle">first Claude session</text>
<rect x="370" y="298.0" width="120" height="42.0" fill="#0b6a9c"/>
<text x="430" y="328.0" class="valw" text-anchor="middle">3.5</text>
<rect x="370" y="284.8" width="120" height="13.2" fill="#a34d21"/>
<text x="430" y="272.8" class="val" text-anchor="middle">4.6 M</text>
<text x="430" y="376" class="lab" text-anchor="middle">Day 2</text>
<text x="430" y="406" class="sub" text-anchor="middle">media day,</text>
<text x="430" y="432" class="sub" text-anchor="middle">first reviews</text>
<rect x="600" y="265.6" width="120" height="74.4" fill="#0b6a9c"/>
<text x="660" y="311.8" class="valw" text-anchor="middle">6.2</text>
<rect x="600" y="85.6" width="120" height="180.0" fill="#1f7a5c"/>
<text x="660" y="184.6" class="valw" text-anchor="middle">15</text>
<rect x="600" y="46.0" width="120" height="39.6" fill="#a34d21"/>
<text x="660" y="74.8" class="valw" text-anchor="middle">3.3</text>
<text x="660" y="34.0" class="val" text-anchor="middle">24.4 M</text>
<text x="660" y="376" class="lab" text-anchor="middle">Day 3</text>
<text x="660" y="406" class="sub" text-anchor="middle">workbench adopted,</text>
<text x="660" y="432" class="sub" text-anchor="middle">13 runs</text>
<rect x="830" y="324.4" width="120" height="15.6" fill="#0b6a9c"/>
<rect x="830" y="310.0" width="120" height="14.4" fill="#1f7a5c"/>
<rect x="830" y="308.2" width="120" height="1.8" fill="#a34d21"/>
<text x="890" y="296.2" class="val" text-anchor="middle">2.6 M</text>
<text x="890" y="376" class="lab" text-anchor="middle">Day 4</text>
<text x="890" y="406" class="sub" text-anchor="middle">polish</text>
<text x="890" y="432" class="sub" text-anchor="middle">and closure</text>
<rect x="1060" y="120" width="28" height="28" fill="#0b6a9c"/><text x="1100" y="142" class="leg">Claude Code</text>
<rect x="1060" y="166" width="28" height="28" fill="#1f7a5c"/><text x="1100" y="188" class="leg">Keelson</text>
<rect x="1060" y="212" width="28" height="28" fill="#a34d21"/><text x="1100" y="234" class="leg">Codex</text>
<text x="1060" y="288" class="note">Day 3 alone carried 70%</text><text x="1060" y="316" class="note">of the four-day total.</text>
</svg>
</div>
</body></html>
