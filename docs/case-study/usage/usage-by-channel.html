<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0;background:#fff}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#102b43;-webkit-font-smoothing:antialiased}
.sheet{width:1400px;height:520px;background:#fff;padding:36px 44px;display:flex;flex-direction:column;gap:6px}
.t{font-family:Manrope,'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;font-weight:800;letter-spacing:-.4px;color:#102c47;margin:0}
.s{font-size:24px;color:#52697b;margin:0 0 8px}
svg text{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.lab{font-size:27px;font-weight:500;fill:#102b43} .sub{font-size:22px;fill:#52697b}
.val{font-size:26px;font-weight:700;fill:#102b43} .valw{font-size:26px;font-weight:700;fill:#fff}
.tick{font-size:21px;fill:#52697b} .ptitle{font-family:Manrope,'DM Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;fill:#102c47}
.note{font-size:22px;fill:#52697b} .leg{font-size:24px;fill:#102b43}
</style></head><body>
<div class="sheet">
<p class="t">Where the tokens went, by channel</p>
<p class="s">Millions of tokens over the four days. Bars are drawn to scale within each panel; the panels use different scales.</p>
<svg width="1312" height="380" viewBox="0 0 1312 380">
<text x="0" y="26" class="ptitle">New input and output</text>
<text x="0" y="90" class="lab">Claude Code</text>
<rect x="250" y="60" width="277.9" height="30" fill="#0b6a9c"/>
<text x="539.9" y="83" class="val">10.59 M</text>
<rect x="250" y="96" width="60.4" height="30" fill="#e8f2f9" stroke="#0b6a9c" stroke-width="2"/>
<text x="322.4" y="119" class="val">2.30 M</text>
<text x="0" y="180" class="lab">Keelson</text>
<rect x="250" y="150" width="390.0" height="30" fill="#1f7a5c"/>
<text x="652.0" y="173" class="val">14.86 M</text>
<rect x="250" y="186" width="34.6" height="30" fill="#e6f4ee" stroke="#1f7a5c" stroke-width="2"/>
<text x="296.6" y="209" class="val">1.32 M</text>
<text x="0" y="270" class="lab">Codex</text>
<rect x="250" y="240" width="140.4" height="30" fill="#a34d21"/>
<text x="402.4" y="263" class="val">5.35 M</text>
<rect x="250" y="276" width="11.3" height="30" fill="#fff1e6" stroke="#a34d21" stroke-width="2"/>
<text x="273.3" y="299" class="val">0.43 M</text>
<rect x="0" y="334" width="26" height="22" fill="#102c47"/><text x="36" y="352" class="leg">new input (uncached input and cache writes)</text>
<rect x="580" y="334" width="26" height="22" fill="#eaeef2" stroke="#102c47" stroke-width="2"/><text x="616" y="352" class="leg">output</text>
<line x1="900" x2="900" y1="10" y2="300" stroke="#cedbe5" stroke-width="2"/>
<text x="940" y="26" class="ptitle">Cached input (cache reads)</text>
<rect x="940" y="68" width="210.0" height="44" fill="#0b6a9c" fill-opacity="0.28" stroke="#0b6a9c" stroke-width="2"/>
<text x="1162.0" y="97" class="val">650.2 M</text>
<text x="940" y="140" class="sub">Claude Code</text>
<rect x="940" y="158" width="53.8" height="44" fill="#1f7a5c" fill-opacity="0.28" stroke="#1f7a5c" stroke-width="2"/>
<text x="1005.8" y="187" class="val">166.6 M</text>
<text x="940" y="230" class="sub">Keelson</text>
<rect x="940" y="248" width="28.1" height="44" fill="#a34d21" fill-opacity="0.28" stroke="#a34d21" stroke-width="2"/>
<text x="980.1" y="277" class="val">87.0 M</text>
<text x="940" y="320" class="sub">Codex</text>
<text x="940" y="350" class="note">96.7% of all input tokens were cache reads.</text>
</svg>
</div>
</body></html>
